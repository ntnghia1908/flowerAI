[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "quickstart-pytorch"
version = "1.0.0"
description = "Federated Learning with PyTorch and Flower (Quickstart Example)"
license = "Apache-2.0"
dependencies = [
    "flwr[simulation]>=1.24.0",
    "flwr-datasets[vision]>=0.5.0",
    "torch==2.8.0",
    "torchvision==0.23.0",
    "scikit-learn>=1.3.0",
]

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.flwr.app]
publisher = "flwrlabs"

# EXPERIMENT CONFIGURATION
# Use experimental server/client apps with comprehensive logging
[tool.flwr.app.components]
serverapp = "pytorchexample.server_app_experiment:app"
clientapp = "pytorchexample.client_app_experiment:app"

[tool.flwr.app.config]
# Server configuration
num-server-rounds = 500
fraction-train = 1.0  # 100% - all 6 clients participate
fraction-evaluate = 1.0  # 100% - all 6 clients evaluate
min-train-nodes = 10  # All 10 clients train each round
min-evaluate-nodes = 10  # All 10 clients evaluate each round

# Client configuration
local-epochs = 1
learning-rate = 0.01
batch-size = 32

# Experiment configuration
strategy = "FedAvg"
distribution = "homo"  # IID distribution for testing
experiment-name = "test_homo"
num-clients = 6  # Using 6 clients to match available data partitions
data-source = "npy"  # "huggingface" or "npy"

# Strategy-specific parameters (optional - only used by specific strategies)
# FedAvgM parameters
server-momentum = 0.9
server-learning-rate = 0.5

# FedProx parameters
proximal-mu = 0.01

# FedAdam, FedYogi, FedAdagrad parameters
eta = 0.01
eta-l = 0.1
tau = 1e-9
beta-1 = 0.9
beta-2 = 0.99

[tool.flwr.federations]
default = "local-simulation"

[tool.flwr.federations.local-simulation]
options.num-supernodes = 6  # 6 clients to match data partitions

[tool.flwr.federations.local-simulation-gpu]
options.num-supernodes = 6  # 6 clients to match data partitions
options.backend.client-resources.num-cpus = 2
options.backend.client-resources.num-gpus = 0.2

[tool.flwr.federations.supergrid-deployment]
address = "supergrid.flower.ai"
enable-account-auth = true
