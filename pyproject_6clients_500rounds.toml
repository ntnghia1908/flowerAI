[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "quickstart-pytorch"
version = "1.0.0"
description = "Federated Learning with PyTorch and Flower (Quickstart Example)"
license = "Apache-2.0"
dependencies = [
    "flwr[simulation]>=1.24.0",
    "flwr-datasets[vision]>=0.5.0",
    "torch==2.8.0",
    "torchvision==0.23.0",
    "scikit-learn>=1.3.0",
]

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.flwr.app]
publisher = "flwrlabs"

# EXPERIMENT CONFIGURATION - 6 CLIENTS, 500 ROUNDS
# Use experimental server/client apps with comprehensive logging
[tool.flwr.app.components]
serverapp = "pytorchexample.server_app_experiment:app"
clientapp = "pytorchexample.client_app_experiment:app"

[tool.flwr.app.config]
# Server configuration - 500 ROUNDS
num-server-rounds = 500

# Client selection - 6 CLIENTS TOTAL
num-clients = 6
fraction-train = 1.0              # Use all 6 clients for training
fraction-evaluate = 1.0           # Use all 6 clients for evaluation
min-train-nodes = 6               # All 6 clients participate in training
min-evaluate-nodes = 6            # All 6 clients participate in evaluation

# Client configuration
local-epochs = 1
learning-rate = 0.1
batch-size = 32

# Experiment configuration
strategy = "FedAvg"
distribution = "homo"
experiment-name = "FedAvg_homo_6clients_500rounds"

[tool.flwr.federations]
default = "local-simulation"

[tool.flwr.federations.local-simulation]
options.num-supernodes = 6        # 6 clients in simulation

[tool.flwr.federations.local-simulation-gpu]
options.num-supernodes = 6        # 6 clients with GPU
options.backend.client-resources.num-cpus = 2
options.backend.client-resources.num-gpus = 0.33  # Each client gets 1/3 GPU (3 clients per GPU)

[tool.flwr.federations.supergrid-deployment]
address = "supergrid.flower.ai"
enable-account-auth = true
